# Auto-refill calendar puzzles for every pack in packs/catalog.json.
# Runs daily and on manual dispatch; commits new JSON if any.
name: Generate pack puzzles

on:
  schedule:
    # 11:00 UTC ≈ morning America/New_York (EST/EDT)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      horizon:
        description: "Days ahead to ensure (including today)"
        required: false
        default: "21"
      force:
        description: "Overwrite existing puzzles (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: generate-puzzles
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & commit puzzles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history not required; need token that can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate puzzles for all calendar packs
        env:
          HORIZON: ${{ github.event.inputs.horizon || '21' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          node scripts/gen-puzzle.mjs --all-packs --horizon "$HORIZON" $EXTRA

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/puzzles packs wordlists
          if git diff --staged --quiet; then
            echo "No puzzle changes."
            exit 0
          fi
          git commit -m "chore(puzzles): refill calendar packs (horizon)"
          git push
